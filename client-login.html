<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Login — Connect with Bayezid</title>
<meta name="description" content="Client login portal for Connect with Bayezid — connect your Facebook, Instagram, or WhatsApp Business account with our team.">
<style>
  :root{
    --bg: #FBFBFA; --panel: #FFFFFF; --text: #191B1F; --muted: #5C6370; --faint: #8A909B;
    --border: #E6E7EA; --accent: #2C4699; --accent-soft: #EDF0FB; --accent-deep: #1B2E66;
    --fb: #1877F2; --fb-dark: #0F5FCC;
    --radius: 12px; --maxw: 440px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; min-height:100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
    display:flex; align-items:center; justify-content:center; padding: 32px 18px;
  }
  .card{
    width:100%; max-width: var(--maxw); background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 36px 28px 28px; box-shadow: 0 10px 30px rgba(27,46,102,.08);
    text-align:center;
  }
  .logo-mark{
    width:56px; height:56px; border-radius: 16px; margin: 0 auto 18px;
    background: linear-gradient(135deg, var(--accent-deep), var(--accent));
    color:#fff; font-weight:800; font-size:1.35rem; letter-spacing:-0.02em;
    display:flex; align-items:center; justify-content:center;
  }
  h1{ font-size:1.3rem; margin:0 0 6px; letter-spacing:-0.01em; }
  .sub{ color: var(--muted); font-size:.92rem; margin: 0 0 26px; }
  button.fb-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background: var(--fb); color:#fff; border:none; border-radius:8px;
    padding: 13px 16px; font-size:.98rem; font-weight:600; cursor:pointer;
    transition: background .15s ease;
  }
  button.fb-btn:hover{ background: var(--fb-dark); }
  button.fb-btn:disabled{ opacity:.6; cursor:default; }
  button.fb-btn svg{ width:20px; height:20px; flex:none; }
  .status{
    margin-top:16px; font-size:.88rem; padding:10px 12px; border-radius:8px; display:none;
  }
  .status.show{ display:block; }
  .status.error{ background:#FDECEC; color:#9A2C2C; }
  .status.info{ background: var(--accent-soft); color: var(--accent-deep); }
  .profile{ display:none; margin-top:20px; text-align:left; }
  .profile.show{ display:flex; align-items:center; gap:12px; }
  .profile img{ width:48px; height:48px; border-radius:50%; }
  .profile .name{ font-weight:700; font-size:.96rem; }
  .profile .email{ color: var(--muted); font-size:.84rem; }
  .fineprint{ margin-top: 24px; font-size:.78rem; color: var(--faint); line-height:1.6; }
  .fineprint a{ color: var(--accent); text-decoration:none; }
  .fineprint a:hover{ text-decoration:underline; }
</style>

<div class="card">
    <div class="logo-mark">CB</div>
    <h1>Client Login</h1>
    <p class="sub">Connect your Facebook, Instagram, or WhatsApp Business account so our team at Connect with Bayezid can get to work.</p>

    <button class="fb-btn" id="fbLoginBtn" onclick="loginWithFacebook()">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12.06C22 6.51 17.52 2 12 2S2 6.51 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.89h2.78l-.44 2.91h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94Z"/></svg>
      Continue with Facebook
    </button>

    <div class="status" id="status"></div>
    <div class="profile" id="profile">
      <img id="profilePic" src="" alt="">
      <div>
        <div class="name" id="profileName"></div>
        <div class="email" id="profileEmail"></div>
      </div>
    </div>

    <p class="fineprint">
      By continuing, you agree to our
      <a href="https://sayadbayezid.com/terms-of-service.html">Terms of Service</a> and
      <a href="https://sayadbayezid.com/privacy-policy.html">Privacy Policy</a>.
      We only request the permissions needed to connect your business account.
    </p>
  </div>

<script>
  // ---- Facebook JavaScript SDK setup ----
  // App: connect with Bayezid — App ID 1781926689123888
  window.fbAsyncInit = function () {
    FB.init({
      appId: '1781926689123888',
      cookie: true,
      xfbml: false,
      version: 'v25.0'   // check developers.facebook.com for the current version before this one sunsets
    });

    // Ties into the App Events product already added to this app
    FB.AppEvents.logPageView();

    // Per Meta's official Facebook Login for Web guide: on every page load,
    // first check whether this person is already logged into Facebook AND
    // has already authorized this app, instead of always showing the button.
    FB.getLoginStatus(function (response) {
      statusChangeCallback(response);
    });
  };
  (function (d, s, id) {
    var js, fjs = d.getElementsByTagName(s)[0];
    if (d.getElementById(id)) { return; }
    js = d.createElement(s); js.id = id;
    js.src = 'https://connect.facebook.net/en_US/sdk.js';
    fjs.parentNode.insertBefore(js, fjs);
  }(document, 'script', 'facebook-jssdk'));

  var BACKEND_BASE = 'https://bayezid-agency-api.sayadmdbayezidhosan.workers.dev';

  function showStatus(message, isError) {
    var el = document.getElementById('status');
    el.textContent = message;
    el.className = 'status show ' + (isError ? 'error' : 'info');
  }

  // response.status is one of:
  //   'connected'      — logged into Facebook AND this app: go straight to the profile
  //   'not_authorized' — logged into Facebook but hasn't approved this app yet
  //   'unknown'        — not logged into Facebook, or logged out: just show the button
  function statusChangeCallback(response) {
    if (response.status === 'connected') {
      fetchAndShowProfile(response.authResponse);
    } else if (response.status === 'not_authorized') {
      showStatus("You're logged into Facebook — tap below to connect your account.", false);
    }
  }

  function loginWithFacebook() {
    var btn = document.getElementById('fbLoginBtn');
    btn.disabled = true;
    showStatus('Connecting to Facebook…', false);

    // Start with permissions that need no App Review (public_profile, email).
    // Add more scopes here once Meta approves them for this app, e.g.:
    // scope: 'public_profile,email,pages_show_list,business_management,ads_management,whatsapp_business_management'
    FB.login(function (response) {
      btn.disabled = false;
      if (response.authResponse) {
        fetchAndShowProfile(response.authResponse);
      } else {
        showStatus('Login was cancelled or not fully authorized.', true);
      }
    }, { scope: 'public_profile,email' });
  }

  function fetchAndShowProfile(authResponse) {
    FB.api('/me', { fields: 'name,email,picture' }, function (user) {
      showStatus('Signed in — welcome, ' + user.name + '.', false);

      var profile = document.getElementById('profile');
      document.getElementById('profileName').textContent = user.name || '';
      document.getElementById('profileEmail').textContent = user.email || '';
      if (user.picture && user.picture.data && user.picture.data.url) {
        document.getElementById('profilePic').src = user.picture.data.url;
      }
      profile.className = 'profile show';
      document.getElementById('fbLoginBtn').style.display = 'none';

      // authResponse.accessToken here is a short-lived client-side token
      // (valid a couple of hours). Send it — and authResponse.userID — to
      // the backend so it can exchange it for a long-lived token
      // (fb_exchange_token grant, ~60 days) using the App Secret, server-side
      // only. This page's own JS never sees or handles the App Secret.
      fetch(BACKEND_BASE + '/api/facebook/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userID: authResponse.userID,
          shortLivedToken: authResponse.accessToken,
          name: user.name,
          email: user.email
        })
      }).catch(function () {
        // Not fatal to the person's login experience — they're still
        // signed in and see their profile either way. Ask me to check
        // client_fb_connections in D1 if a connection seems to be missing.
      });
    });
  }
</script>
</body>
</html>
