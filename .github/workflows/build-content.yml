name: Regenerate blog + case studies + news

on:
  push:
    branches: [main]
    paths:
      - "blog-posts/**"
      - "content/**"
      - "scripts/build-blog.js"
      - "scripts/build-content.js"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Build blog (blog-posts/*.md → /blog/)
        run: node scripts/build-blog.js

      - name: Build case studies + news (content/** → case-studies/, news/)
        run: node scripts/build-content.js

      - name: Commit and push generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Regenerate blog, case studies, and news"
          git push
