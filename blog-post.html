<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title id="page-title">Blog Post - Sayad md Bayezid Hosan</title>
    <meta id="page-description" name="description" content="Read this article from Sayad md Bayezid Hosan" />
    <meta name="author" content="Sayad md Bayezid Hosan" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph Meta Tags -->
    <meta id="og-title" property="og:title" content="Blog Post" />
    <meta id="og-description" property="og:description" content="Read this article" />
    <meta id="og-image" property="og:image" content="" />
    <meta property="og:type" content="article" />
    <meta id="og-url" property="og:url" content="" />
    
    <!-- Canonical URL -->
    <link id="canonical" rel="canonical" href="" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #00D9FF;
            --primary-dark: #0F1419;
            --accent: #FF6B35;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --bg-dark: #0F1419;
            --bg-card: #1a1f2e;
            --border-color: #2a2f3e;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
        }
        
        a {
            color: var(--primary);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        a:hover {
            color: var(--accent);
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Navigation */
        nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(15, 20, 25, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
        }
        
        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
        }
        
        .logo span {
            color: var(--primary);
        }
        
        nav ul {
            display: none;
            list-style: none;
            gap: 2rem;
        }
        
        @media (min-width: 768px) {
            nav ul {
                display: flex;
            }
        }
        
        nav a {
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        /* Hero Section */
        .hero {
            min-height: 50vh;
            display: flex;
            align-items: center;
            padding: 4rem 0;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a2332 100%);
            position: relative;
            overflow: hidden;
        }
        
        .hero::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(30px); }
        }
        
        .hero-content {
            position: relative;
            z-index: 1;
        }
        
        .hero h1 {
            font-size: 2.5rem;
            line-height: 1.3;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .hero-meta {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }
        
        .hero-meta span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .blog-category {
            display: inline-block;
            background: rgba(0, 217, 255, 0.1);
            color: var(--primary);
            padding: 0.4rem 1rem;
            border-radius: 0.3rem;
            font-weight: 600;
            font-size: 0.85rem;
        }
        
        .hero-image {
            margin-top: 2rem;
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        
        .hero-image img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Blog Content */
        .blog-content-section {
            padding: 4rem 0;
            background: var(--bg-dark);
        }
        
        .blog-content {
            background: var(--bg-card);
            padding: 3rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
        }
        
        .blog-content h2 {
            font-size: 1.8rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }
        
        .blog-content h3 {
            font-size: 1.4rem;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }
        
        .blog-content p {
            margin-bottom: 1rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }
        
        .blog-content ul, .blog-content ol {
            margin-left: 2rem;
            margin-bottom: 1rem;
        }
        
        .blog-content li {
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }
        
        .blog-content code {
            background: rgba(0, 217, 255, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 0.3rem;
            color: var(--primary);
            font-family: 'Courier New', monospace;
        }
        
        .blog-content pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
        }
        
        .blog-content pre code {
            background: none;
            padding: 0;
            color: var(--primary);
        }
        
        .blog-content blockquote {
            border-left: 4px solid var(--primary);
            padding-left: 1rem;
            margin: 1.5rem 0;
            color: var(--text-secondary);
            font-style: italic;
        }
        
        /* Tags Section */
        .tags-section {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }
        
        .tags-section h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
        
        .tags {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        
        .tag {
            display: inline-block;
            background: rgba(255, 107, 53, 0.1);
            color: var(--accent);
            padding: 0.4rem 0.8rem;
            border-radius: 0.3rem;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .tag:hover {
            background: rgba(255, 107, 53, 0.2);
        }
        
        /* FAQ Section */
        .faq-section {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }
        
        .faq-section h3 {
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
        }
        
        .faq-item {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(0, 217, 255, 0.05);
            border-radius: 0.5rem;
            border-left: 3px solid var(--primary);
        }
        
        .faq-question {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.5rem;
            cursor: pointer;
        }
        
        .faq-answer {
            color: var(--text-secondary);
            line-height: 1.7;
        }
        
        /* Back Link */
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--primary);
            font-weight: 500;
        }
        
        .back-link:hover {
            color: var(--accent);
        }
        
        /* Footer */
        footer {
            border-top: 1px solid var(--border-color);
            padding: 3rem 0;
            text-align: center;
            color: var(--text-secondary);
        }
        
        footer a {
            color: var(--primary);
        }
        
        footer a:hover {
            color: var(--accent);
        }
        
        /* Loading State */
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 1.8rem;
            }
            
            .blog-content {
                padding: 1.5rem;
            }
            
            .hero-meta {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav>
        <div class="container">
            <div class="logo">Bayezid<span>.</span></div>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/#about">About</a></li>
                <li><a href="/#services">Services</a></li>
                <li><a href="/#achievements">Achievements</a></li>
                <li><a href="/#projects">Projects</a></li>
                <li><a href="/blog.html">Blog</a></li>
                <li><a href="/#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <a href="/blog.html" class="back-link">← Back to Blog</a>
            <div class="hero-content">
                <h1 id="blog-title">Loading...</h1>
                <div class="hero-meta">
                    <span class="blog-category" id="blog-category">General</span>
                    <span id="blog-author">By Sayad Md Bayezid Hosan</span>
                    <span id="blog-date">Date</span>
                </div>
            </div>
            <div class="hero-image">
                <img id="blog-image" src="" alt="Blog post image" />
            </div>
        </div>
    </section>

    <!-- Blog Content -->
    <section class="blog-content-section">
        <div class="container">
            <div id="content-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading blog post...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Sayad md Bayezid Hosan. All Rights Reserved.</p>
            <p>
                <a href="/">Home</a> | 
                <a href="/blog.html">Blog</a> | 
                <a href="https://connectwithbayezid.blogspot.com" target="_blank">Blogger</a> | 
                <a href="https://github.com/bayzed123" target="_blank">GitHub</a> | 
                <a href="https://www.linkedin.com/in/sayadbayezid" target="_blank">LinkedIn</a>
            </p>
        </div>
    </footer>

    <script>
        // Function to generate URL-friendly slug from title
        function generateSlug(title) {
            return title
                .toLowerCase()
                .trim()
                .replace(/[^\w\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-');
        }

        // Function to find blog post by slug
        async function findBlogBySlug(slug) {
            try {
                const response = await fetch('/blogs.json');
                if (!response.ok) {
                    throw new Error('Failed to load blogs');
                }
                
                const data = await response.json();
                const blogs = data.blogs || [];
                
                // Find blog matching the slug
                const blog = blogs.find(b => generateSlug(b.title) === slug);
                return blog;
            } catch (error) {
                console.error('Error finding blog:', error);
                return null;
            }
        }

        // Function to extract slug from URL
        function getSlugFromURL() {
            const path = window.location.pathname;
            const match = path.match(/\/blog\/(.+?)\.html$/);
            return match ? match[1] : null;
        }

        // Function to render blog post
        function renderBlogPost(blog) {
            // Update page title and meta tags
            document.title = `${blog.title} - Sayad md Bayezid Hosan`;
            document.getElementById('page-title').textContent = `${blog.title} - Sayad md Bayezid Hosan`;
            document.getElementById('page-description').content = blog.excerpt;
            document.getElementById('og-title').content = blog.title;
            document.getElementById('og-description').content = blog.excerpt;
            document.getElementById('og-image').content = blog.image || '';
            document.getElementById('og-url').content = window.location.href;
            document.getElementById('canonical').href = window.location.href;
            
            // Update hero section
            document.getElementById('blog-title').textContent = blog.title;
            document.getElementById('blog-category').textContent = blog.category || 'General';
            document.getElementById('blog-author').textContent = `By ${blog.author || 'Sayad Md Bayezid Hosan'}`;
            
            const date = new Date(blog.date).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('blog-date').textContent = date;
            document.getElementById('blog-image').src = blog.image || '';
            document.getElementById('blog-image').alt = blog.title;
            
            // Render blog content
            let contentHTML = `<div class="blog-content">`;
            
            // Convert markdown-like content to HTML
            const contentLines = blog.content.split('\n\n');
            contentLines.forEach(line => {
                if (line.trim()) {
                    contentHTML += `<p>${line.trim()}</p>`;
                }
            });
            
            // Add tags section
            if (blog.tags && blog.tags.length > 0) {
                contentHTML += `
                    <div class="tags-section">
                        <h3>Tags</h3>
                        <div class="tags">
                            ${blog.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                `;
            }
            
            // Add FAQ section
            if (blog.faq && blog.faq.length > 0) {
                contentHTML += `
                    <div class="faq-section">
                        <h3>Frequently Asked Questions</h3>
                        ${blog.faq.map(item => `
                            <div class="faq-item">
                                <div class="faq-question">${item.question}</div>
                                <div class="faq-answer">${item.answer}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            contentHTML += `</div>`;
            
            document.getElementById('content-container').innerHTML = contentHTML;
        }

        // Load and render blog post
        async function loadBlogPost() {
            const slug = getSlugFromURL();
            
            if (!slug) {
                document.getElementById('content-container').innerHTML = `
                    <div class="loading">
                        <p>Blog post not found. <a href="/blog.html">Go back to blog</a></p>
                    </div>
                `;
                return;
            }
            
            const blog = await findBlogBySlug(slug);
            
            if (!blog) {
                document.getElementById('content-container').innerHTML = `
                    <div class="loading">
                        <p>Blog post not found. <a href="/blog.html">Go back to blog</a></p>
                    </div>
                `;
                return;
            }
            
            renderBlogPost(blog);
        }

        // Load blog post when page loads
        document.addEventListener('DOMContentLoaded', loadBlogPost);
    </script>
</body>
</html>
