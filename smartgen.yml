site_name: Smartgen NexusLeads Developer Docs
site_url: https://sayadbayezid/Smartgen-Nexuses-Lead-Collector/
site_author: Sayad Md Bayezid Hosan & SmartGen Platform
site_description: Developer documentation and API reference for Smartgen NexusLeads, a secure B2B lead discovery, verification, enrichment, and Google Sheets export platform.
repo_url: https://github.com/bayzed123/sayadbayezid-portfolio-
repo_name: GitHub
edit_uri: edit/main/docs/

# SmartGen Docs is the documentation engine for this repository.
# Keep provider credentials in Cloudflare bindings or GitHub Actions secrets only.
theme:
  name: apiplay
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - toc.integrate
    - content.code.copy
    - header.autohide
  icon:
    repo: fontawesome/brands/github
  extra_css:
    - stylesheets/extra.css
  extra_javascript:
    - javascripts/docs.js

plugins:
  - search
  - scaffold

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Quick Start: getting-started/quick-start.md
      - Local Development: getting-started/local-development.md
      - Deployment: getting-started/deployment.md
  - Platform:
      - Architecture: platform/architecture.md
      - Lead Lifecycle: platform/lead-lifecycle.md
      - Plans and Modes: platform/plans-and-modes.md
      - Security: platform/security.md
  - API Reference:
      - Overview: api/index.md
      - Authentication: api/authentication.md
      - Account and BYOK: api/account.md
      - Lead Discovery: api/discovery.md
      - Enrichment and Export: api/data-pipeline.md
      - Usage and Pricing: api/usage-pricing.md
      - Errors: api/errors.md
  - Guides:
      - Google Sheets Setup: guides/google-sheets.md
      - BYOK Configuration: guides/byok.md
      - GitHub Paid Activation: guides/paid-activation.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - Environment Bindings: reference/environment.md
      - Data Model: reference/data-model.md
      - Changelog: reference/changelog.md
  - Community: contributing.md

extra:
  powered_by_name: SmartGen Docs
  powered_by_url: https://docs.smartgentools.com/
  product_url: https://smartgentools.com
  api_base_url: https://nexusleads-api.mahmudajenny6.workers.dev
  founder_url: https://sayadbayezid.com
  analytics:
    provider: google
    property: G-7FPD269E1J
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bayzed123/sayadbayezid-portfolio-
    - icon: fontawesome/solid/globe
      link: https://smartgentools.com
    - icon: fontawesome/solid/user
      link: https://sayadbayezid.com