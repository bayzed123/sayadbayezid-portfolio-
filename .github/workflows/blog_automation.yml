name: Blog Automation

on:
  push:
    paths:
      - 'blog_uploads/**.html'
  workflow_dispatch:

jobs:
  convert-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4

      - name: Run conversion script
        run: python scripts/convert_blogs.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blogs/
          git commit -m "Auto-convert HTML blog to JSON [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Create and push a version tag
        run: |
          git tag v01.01.01  # Replace `v01.01.01` with the desired version dynamically if you want
          git push origin v01.01.01