name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Invoice Tool
        working-directory: tools/invoice
        run: |
          npm install
          npm run build

      - name: Assemble GitHub Pages artifact
        run: |
          rm -rf .pages
          mkdir -p .pages/tools/invoice
          cp -a ./* .pages/
          rm -rf .pages/.git .pages/.github .pages/tools/invoice
          cp -a tools/invoice/build/. .pages/tools/invoice/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.pages'

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4