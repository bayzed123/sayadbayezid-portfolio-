<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Login — Connect with Bayezid</title>
<!--
  There were two sign-in pages and they used different Meta flows.

  This one used the Facebook JavaScript SDK (FB.login) against
  /api/facebook/connect. That flow needs "Login with the JavaScript SDK"
  switched on in the App Dashboard along with an Allowed Domains list, and we
  deliberately leave it off: the SDK hands an access token to the browser,
  where the server-side code flow never does.

  facebook-business-login.html is the flow we keep. It uses response_type=code
  and the Worker exchanges that code with the App Secret, so no token ever
  reaches the page. Its URL is also the one registered in the Worker's redirect
  allowlist and in the App Dashboard, so it is the URL that must not move.

  Every link on the site now points straight at that page. This file stays
  only so older links and bookmarks land somewhere rather than 404, and it
  redirects immediately. Nothing here talks to Meta.
-->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://sayadbayezid.com/facebook-business-login.html">
<meta http-equiv="refresh" content="0; url=/facebook-business-login.html">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px 16px;background:#f7f8fb;color:#171b24;line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .note{max-width:34rem;text-align:center}
  h1{font-size:1.25rem;margin:0 0 8px}
  p{color:#606a7b;margin:0 0 16px}
  a{color:#1d4ed8}
</style>
</head>
<body>
<main class="note">
  <h1>Client login has moved</h1>
  <p>Taking you to the secure business login page.</p>
  <p><a href="/facebook-business-login.html">Continue to business login</a></p>
</main>
<script>window.location.replace('/facebook-business-login.html');</script>
</body>
</html>
