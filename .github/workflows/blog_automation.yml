name: Blog Automation

on:
  push:
    paths:
      - 'blog_uploads/**.html'
  workflow_dispatch:

jobs:
  convert-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Explicitly check out the 'main' branch (update 'main' if your branch name is different)
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4

      - name: Run conversion script
        run: python scripts/convert_blogs.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blogs/
          git commit -m "Auto-convert HTML blog to JSON [skip ci]" || echo "No changes to commit"
          # Explicitly push to the 'main' branch (update 'main' if your branch name is different)
          git push origin HEAD:main