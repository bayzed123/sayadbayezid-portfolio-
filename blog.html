<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!--
    This page used to be a second blog feed. It fetched /blogs/index.json — a
    path that does not exist — so it rendered an empty state to every visitor
    while still ranking in Google (107 impressions, 9 clicks over 90 days).

    It is a redirect now rather than a deletion: the URL has real search
    history, and a 404 would throw that away. GitHub Pages cannot serve a 301,
    so this is the static equivalent — a canonical pointing at the real feed,
    an instant meta refresh, and a JS replace() that leaves no history entry.
    The real feed lives at /blog/ and is generated by scripts/build-blog.js.
  -->
  <title>Blog — Connect with Bayezid</title>
  <link rel="canonical" href="https://sayadbayezid.com/blog/" />
  <meta http-equiv="refresh" content="0; url=/blog/" />
  <meta name="robots" content="noindex, follow" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0A0F0D;
      color: #93A199;
      font: 15px/1.6 'Inter', system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    a { color: #00D084; }
  </style>
</head>
<body>
  <!-- Visible only if the refresh is blocked; never a dead end. -->
  <p>The blog has moved to <a href="/blog/">sayadbayezid.com/blog/</a>.</p>
  <script>location.replace('/blog/');</script>
</body>
</html>
