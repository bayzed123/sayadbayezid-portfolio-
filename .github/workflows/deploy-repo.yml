name: Deploy Frontend to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # build-sitemap.mjs reads each file's last commit date for <lastmod>.
          # The default shallow clone has one commit, which would stamp every
          # page with today and teach Google that lastmod here means nothing.
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # A shipped fix nobody can see has not shipped. Pages serves
      # /assets/js/admin.js with a cache lifetime, so a returning browser keeps
      # running yesterday's console until that expires -- which is exactly how a
      # merged change comes to look like it did nothing. Stamping the commit
      # onto the URL makes every deploy a new URL, which a cache cannot answer.
      #
      # Done here rather than in the file so the committed HTML keeps clean
      # URLs and nobody has to remember to bump a version by hand.
      - name: Stamp the admin console assets with the commit
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::12}"
          perl -pi -e 's{(/assets/(?:css/admin\.css|js/admin\.js))(\?v=[^"]*)?"}{$1?v='"$sha"'"}g' admin/index.html
          # Printed so the run log shows what the browser will be asked to fetch.
          grep -n 'assets/css/admin\.css\|assets/js/admin\.js' admin/index.html

      # The sitemaps are build output, regenerated here so the published pair
      # always describes the commit being deployed. Generating them at deploy
      # time rather than committing them means they cannot be stale and cannot
      # produce a bot commit on every merge -- a page added is a page listed,
      # with nobody having to remember a second file.
      #
      # Needs full history: lastmod is the date of each file's last commit, and
      # a shallow checkout would date the whole site to the day of the clone.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the sitemaps
        run: node scripts/build-sitemap.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire root repository (where your index.html is located)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4